<!DOCTYPE html>
<html>
<head>
    <title>🎵 Modern Music Player</title>
    {% load static %}
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            display: flex; 
            justify-content: flex-start; 
            align-items: flex-start; 
            min-height: 100vh; 
            background: linear-gradient(135deg,#1a1a2e,#16213e,#0f3460); 
            color: #fff; 
            padding: 0;
            margin: 0;
        }
        .container {
            display: flex;
            gap: 20px;
            width: 100%;
            height: 100vh;
        }

        .main-column {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .top-row {
            display: flex;
            gap: 20px;
        }


        .player, .lyrics-card, .playlist-card { 
            background: rgba(255,255,255,0.05); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 20px; 
            padding: 24px; 
        }

        /* Player box */
        .player { 
            width: 780px; 
            height: 500px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            text-align: center;
            margin-top: 20px;
        }

        .cover img { 
            width: 160px; 
            height: 160px; 
            border-radius: 50%; 
            border: 3px solid rgba(255,255,255,0.2); 
            object-fit: cover; 
            animation: rotate 12s linear infinite;
            animation-play-state: paused;
            box-shadow: 0 0 20px rgba(102,126,234,0.3);
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Info judul & artis */
        .info {
            width: 100%;
            height: 64px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 12px;
            text-align: center;
            gap: 4px;
        }

        .title {
            font-size: 16px;
            font-weight: 700;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 18px;
            max-height: 36px;
        }

        .artist {
            font-size: 12px;
            opacity: 0.75;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .progress-container { width: 100%; height: 4px; background: rgba(255,255,255,0.1); margin: 12px 0; cursor: pointer; border-radius: 2px; }
        .progress { height: 100%; width: 0%; background: linear-gradient(90deg,#667eea,#764ba2); border-radius: 2px; }
        .time-display { display: flex; justify-content: space-between; font-size: 12px; opacity: 0.7; }
        .controls { display: flex; justify-content: center; gap: 16px; margin: 16px 0; }
        .control-btn { width: 44px; height: 44px; border-radius: 12px; border: none; background: rgba(255,255,255,0.1); color: white; font-size: 16px; cursor: pointer; transition: all 0.2s; }
        .control-btn:hover { background: rgba(255,255,255,0.15); transform: scale(1.05); }
        #playBtn { width: 56px; height: 56px; font-size: 20px; background: linear-gradient(135deg,#667eea,#764ba2); }
        .volume-container { display: flex; justify-content: center; gap: 12px; align-items: center; }
        .volume-slider { width: 80px; }

        /* Lyrics box */
        .lyrics-card { 
            width: 380px; 
            height: 500px;
            display: flex;
            flex-direction: column;
            padding: 18px;
            margin-top: 20px;
        }

        .lyrics-title {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 8px;
            flex: none;
        }

        .lyrics-list {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0 12px;
        }

        .lyrics-list.empty {
            display: flex;
            justify-content: center;
            align-items: center;
            font-style: italic;
            opacity: 0.6;
        }

        .lyric-line {
            line-height: 22px;
            font-size: 14px;
            opacity: 0.45;
            margin-bottom: 2px;
            white-space: normal;
            overflow-wrap: break-word;
            transition: 0.3s ease;
        }

        .lyric-line.active {
            opacity: 1;
            font-weight: 700;
            color: #fff;
            transform: scale(1.05); 
        }

        /* VISUALIZER CARD BARU - DI BAWAH PLAYER DAN LYRICS */
        .visualizer-card {
            width: 100%;
            height: 200px;
            background: rgba(255,255,255,0.05); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 20px; 
            padding: 18px;
            margin-top: 20px; /* Posisi di bawah player dan lyrics */
            display: flex;
            flex-direction: column;
        }

        .visualizer-title {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 12px;
            flex: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .visualizer-container {
            width: 100%;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 20px;
        }

        .visualizer {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: end;
            gap: 2px;
            opacity: 0.8;
        }

        .bar {
            width: 100%;
            min-height: 3px;
            background: linear-gradient(to top, #667eea, #764ba2, #ff6b6b);
            border-radius: 2px;
            transition: height 0.1s ease;
            animation: pulse 1.5s ease-in-out infinite alternate;
        }

        .bar:nth-child(odd) { animation-delay: -0.2s; }
        .bar:nth-child(3n) { animation-delay: -0.4s; }
        .bar:nth-child(4n) { animation-delay: -0.6s; }
        .bar:nth-child(5n) { animation-delay: -0.8s; }

        @keyframes pulse {
            0% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* Playlist box - Full height di kiri mepet */
        .playlist-card {
            width: 320px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            order: -1;
            border-radius: 0 20px 20px 0;
            margin: 0;
        }

        .playlist-title {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .playlist-count {
            background: rgba(255,255,255,0.1);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .song-list {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 8px;
        }

        .song-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 8px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 4px;
        }

        .song-item:hover {
            background: rgba(255,255,255,0.05);
        }

        .song-item.active {
            background: rgba(102,126,234,0.2);
            border: 1px solid rgba(102,126,234,0.3);
        }

        .song-item.active .song-info .song-title {
            color: #667eea;
            font-weight: 600;
        }

        .song-cover {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.1);
            flex-shrink: 0;
        }

        .song-info {
            flex: 1;
            min-width: 0;
        }

        .song-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            font-size: 12px;
            opacity: 0.7;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-duration {
            font-size: 12px;
            opacity: 0.6;
            flex-shrink: 0;
        }

        /* Scrollbar untuk semua container */
        .lyrics-list::-webkit-scrollbar,
        .song-list::-webkit-scrollbar { 
            width: 6px; 
        }
        .lyrics-list::-webkit-scrollbar-track,
        .song-list::-webkit-scrollbar-track { 
            background: rgba(255, 255, 255, 0.05); 
            border-radius: 10px; 
        }
        .lyrics-list::-webkit-scrollbar-thumb,
        .song-list::-webkit-scrollbar-thumb { 
            background: linear-gradient(180deg, #0f3460, #16213e); 
            border-radius: 10px; 
        }
        .lyrics-list::-webkit-scrollbar-thumb:hover,
        .song-list::-webkit-scrollbar-thumb:hover { 
            background: linear-gradient(180deg, #1e3a8a, #1e40af); 
        }

        /* Responsive design */
        @media (max-width: 1200px) {
            .container {
                flex-direction: column;
                align-items: center;
                gap: 16px;
                height: auto;
                padding: 20px;
            }
            
            .playlist-card {
                width: 100%;
                max-width: 400px;
                height: 400px;
                order: 0;
            }
            
            .player, .lyrics-card, .visualizer-card {
                width: 100%;
                max-width: 400px;
                margin-top: 0;
            }

            .visualizer-card {
                margin-top: 16px;
            }
        }
        
    </style>
</head>
<body>
    <div class="container">
        <!-- Playlist di kiri -->
        <div class="playlist-card">
            <div class="playlist-title">
                🎵 Playlist
                <span class="playlist-count" id="playlistCount">{{ songs|length }}</span>
            </div>
            <div class="song-list" id="songList">
                {% for song in songs %}
                <div class="song-item{% if forloop.first %} active{% endif %}" 
                    onclick="selectSong({{ forloop.counter0 }})" 
                    data-index="{{ forloop.counter0 }}">
                    <img class="song-cover" 
                        src="{% if song.cover %}{{ song.cover.url }}{% else %}{% static 'default.jpg' %}{% endif %}" 
                        alt="{{ song.title }}">
                    <div class="song-info">
                        <div class="song-title">{{ song.title }}</div>
                        <div class="song-artist">{{ song.artist|default:"Unknown Artist" }}</div>
                    </div>
                    <div class="song-duration" id="duration-{{ forloop.counter0 }}">--:--</div>
                </div>
                {% endfor %}
            </div>
        </div>

        <!-- Kolom utama: player + lyrics + visualizer -->
        <div class="main-column">
            <div class="top-row">
                <div class="player" id="player">
                    <div class="cover">
                        {% if songs.0.cover %}
                            <img id="cover" src="{{ songs.0.cover.url }}" alt="Album Cover">
                        {% else %}
                            <img id="cover" src="{% static 'default.jpg' %}" alt="Album Cover">
                        {% endif %}
                    </div>
                    <div class="info">
                        <div class="title" id="title">{{ songs.0.title }}</div>
                        <div class="artist" id="artist">{{ songs.0.artist }}</div>
                    </div>
                    <div class="progress-container" id="progressContainer">
                        <div class="progress" id="progress"></div>
                    </div>
                    <div class="time-display">
                        <span id="currentTime">0:00</span>
                        <span id="duration">0:00</span>
                    </div>
                    <audio id="audio" src="{{ songs.0.file.url }}"></audio>
                    <div class="controls">
                        <button class="control-btn" onclick="prevSong()">⏮</button>
                        <button class="control-btn" id="playBtn" onclick="togglePlay()">▶</button>
                        <button class="control-btn" onclick="nextSong()">⏭</button>
                    </div>
                    <div class="volume-container">
                        🔊 <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="70">
                    </div>
                </div>

                <div class="lyrics-card">
                    <div class="lyrics-title">🎧 Lyrics</div>
                    <div class="lyrics-list" id="lyrics">No lyrics available.</div>
                </div>
            </div>

            <!-- Visualizer diposisikan di bawah player + lyrics -->
            <div class="visualizer-card">
                <div class="visualizer-title">🎶 Audio Visualizer</div>
                <div class="visualizer-container">
                    <div class="visualizer" id="visualizer"></div>
                </div>
            </div>
        </div>
    </div>


    <script>
        // KODE BACKEND ASLI - TETAP DIPERTAHANKAN
        const songs = [
            {% for song in songs %}
            {
                title: "{{ song.title|escapejs }}",
                artist: "{{ song.artist|default:'Unknown Artist'|escapejs }}",
                file: "{{ song.file.url }}",
                cover: "{% if song.cover %}{{ song.cover.url }}{% else %}{% static 'default.jpg' %}{% endif %}",
                lyric: "{{ song.lyric|default:''|linebreaksbr|escapejs }}",
                lrc: "{{ song.lrc|default:''|escapejs }}"
            }{% if not forloop.last %},{% endif %}
            {% endfor %}
        ];

        let currentIndex = 0;
        let isPlaying = false;
        let lrcData = [];

        // VARIABEL BARU HANYA UNTUK VISUALIZER
        let audioContext;
        let analyser;
        let source;
        let dataArray;
        let bars = [];

        const audio = document.getElementById("audio");
        const title = document.getElementById("title");
        const artist = document.getElementById("artist");
        const cover = document.getElementById("cover");
        const playBtn = document.getElementById("playBtn");
        const progress = document.getElementById("progress");
        const progressContainer = document.getElementById("progressContainer");
        const currentTimeEl = document.getElementById("currentTime");
        const durationEl = document.getElementById("duration");
        const volumeSlider = document.getElementById("volumeSlider");
        const lyricsEl = document.getElementById("lyrics");
        const songListEl = document.getElementById("songList");
        const visualizer = document.getElementById("visualizer");

        // FUNGSI BARU HANYA UNTUK VISUALIZER
        function initVisualizer() {
            // Create 100 bars
            for (let i = 0; i < 100; i++) {
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.height = '3px';
                visualizer.appendChild(bar);
                bars.push(bar);
            }

            // Setup Web Audio API (opsional, jika tidak bisa akan fallback)
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                
                const bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);

                if (!source && audio) {
                    source = audioContext.createMediaElementSource(audio);
                    source.connect(analyser);
                    analyser.connect(audioContext.destination);
                }
            } catch (e) {
                console.log('Web Audio API not supported, using fallback animation');
            }
        }

        function updateVisualizer() {
            if (!bars.length) return;
            
            if (analyser && dataArray) {
                // Real audio analysis
                analyser.getByteFrequencyData(dataArray);
                for (let i = 0; i < bars.length && i < dataArray.length; i++) {
                    const barHeight = (dataArray[i] / 255) * 60 + 3;
                    bars[i].style.height = barHeight + 'px';
                }
            } else {
                // Fallback simulation
                for (let i = 0; i < bars.length; i++) {
                    const height = Math.random() * 50 + 3;
                    bars[i].style.height = height + 'px';
                }
            }
            
            if (isPlaying) {
                requestAnimationFrame(updateVisualizer);
            }
        }

        // SEMUA FUNGSI ASLI - TIDAK DIUBAH
        function formatTime(s) {
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${m}:${sec.toString().padStart(2, "0")}`;
        }

        function parseLRC(lrcText) {
            const lines = lrcText.split(/\r?\n/);
            const result = [];
            const regex = /\[(\d{2}):(\d{2})(?:\.(\d{2,3}))?\](.*)/;
            lines.forEach(line => {
                const match = regex.exec(line);
                if (match) {
                    const min = parseInt(match[1]);
                    const sec = parseInt(match[2]);
                    const ms = match[3] ? parseInt(match[3].padEnd(3, '0')) : 0;
                    const time = min * 60 + sec + ms / 1000;
                    const text = match[4].trim();
                    if (text) result.push({ time, text });
                }
            });
            return result;
        }

        function renderLyrics(song) {
            lyricsEl.innerHTML = "";
            lyricsEl.classList.remove("empty");
            lrcData = [];

            if (song.lrc) {
                lrcData = parseLRC(song.lrc);
                if (lrcData.length === 0) {
                    lyricsEl.textContent = "No lyrics available.";
                    lyricsEl.classList.add("empty");
                } else {
                    lrcData.forEach((line, i) => {
                        const div = document.createElement("div");
                        div.className = "lyric-line";
                        div.dataset.index = i;
                        div.textContent = line.text;
                        lyricsEl.appendChild(div);
                    });
                }
            } else if (song.lyric) {
                const lines = song.lyric.split(/<br\s*\/?>|\n/);
                lines.forEach(line => {
                    const div = document.createElement("div");
                    div.className = "lyric-line";
                    div.textContent = line;
                    lyricsEl.appendChild(div);
                });
            } else {
                lyricsEl.textContent = "No lyrics available.";
                lyricsEl.classList.add("empty");
            }
        }

        function highlightLyrics(currentTime) {
            if (lrcData.length === 0) return;
            let idx = lrcData.findIndex((l, i) =>
                currentTime >= l.time && (i === lrcData.length - 1 || currentTime < lrcData[i+1].time)
            );
            if (idx === -1) idx = 0;
            [...lyricsEl.children].forEach((line, i) => {
                line.classList.toggle("active", i === idx);
            });

            const activeLine = lyricsEl.querySelector(".active");
            if (activeLine) {
                const offset = activeLine.offsetTop - lyricsEl.clientHeight / 2 + activeLine.clientHeight / 2;
                lyricsEl.scrollTo({ top: offset, behavior: "smooth" });
            }
        }

        function updatePlaylistHighlight() {
            const songItems = document.querySelectorAll('.song-item');
            songItems.forEach((item, i) => {
                item.classList.toggle('active', i === currentIndex);
            });
        }

        function loadSong(index) {
            const song = songs[index];
            title.textContent = song.title;
            artist.textContent = song.artist;
            cover.src = song.cover;
            audio.src = song.file;
            renderLyrics(song);
            currentIndex = index;
            updatePlaylistHighlight();
        }

        function selectSong(index) {
            if (index === currentIndex && isPlaying) {
                audio.pause();
            } else {
                loadSong(index);
                audio.play().catch(console.error);
            }
        }

        function togglePlay() {
            if (isPlaying) { 
                audio.pause(); 
            } else { 
                audio.play().catch(console.error); 
            }
        }

        function nextSong() {
            currentIndex = (currentIndex + 1) % songs.length;
            loadSong(currentIndex);
            audio.play().catch(console.error); // langsung play tanpa cek isPlaying
        }

        function prevSong() {
            currentIndex = (currentIndex - 1 + songs.length) % songs.length;
            loadSong(currentIndex);
            audio.play().catch(console.error);
        }


        // Event listeners - ASLI + SEDIKIT TAMBAHAN UNTUK VISUALIZER
        audio.addEventListener("timeupdate", () => {
            if (!audio.duration) return;
            const percent = (audio.currentTime / audio.duration) * 100;
            progress.style.width = percent + "%";
            currentTimeEl.textContent = formatTime(audio.currentTime);
            durationEl.textContent = formatTime(audio.duration);
            highlightLyrics(audio.currentTime);
        });

        audio.addEventListener("loadedmetadata", () => {
            const durationElement = document.getElementById(`duration-${currentIndex}`);
            if (durationElement && audio.duration) {
                durationElement.textContent = formatTime(audio.duration);
            }
        });

        audio.addEventListener("play", () => { 
            isPlaying = true; 
            playBtn.textContent = "⏸"; 
            cover.style.animationPlayState = "running"; 
            
            // Start visualizer
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
            updateVisualizer();
        });

        audio.addEventListener("pause", () => { 
            isPlaying = false; 
            playBtn.textContent = "▶"; 
            cover.style.animationPlayState = "paused"; 
        });

        audio.addEventListener("ended", nextSong);

        progressContainer.addEventListener("click", (e) => {
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            audio.currentTime = (clickX / width) * audio.duration;
        });

        volumeSlider.addEventListener("input", () => {
            audio.volume = volumeSlider.value / 100;
        });

        // Load durations for all songs - ASLI
        function loadAllDurations() {
            songs.forEach((song, index) => {
                const tempAudio = new Audio(song.file);
                tempAudio.addEventListener('loadedmetadata', () => {
                    const durationElement = document.getElementById(`duration-${index}`);
                    if (durationElement) {
                        durationElement.textContent = formatTime(tempAudio.duration);
                    }
                });
            });
        }

        function init() {
            audio.volume = volumeSlider.value / 100;
            loadSong(0);
            loadAllDurations();
            initVisualizer(); // HANYA INI YANG DITAMBAHKAN
        }
        
        init();
    </script>
</body>
</html>
